name: hadid_exchange
description: "Hadid Money Exchange — offline currency exchange accounting for Windows."
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  go_router: ^16.0.0
  flutter_svg: ^2.3.0
  easy_localization: ^3.0.8
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.5
  sqflite_common_ffi: ^2.4.2
  shared_preferences: ^2.5.3
  file_picker: ^10.2.0
  # Pinned to the official repo's unpublished 5.0.0 (archive ^4, required by
  # desktop_updater). Hosted excel 4.0.6 pins archive ^3 and no longer
  # compiles against archive 4. Switch back to hosted `excel: ^5.0.0`
  # once 5.0.0 is published on pub.dev.
  excel:
    git:
      url: https://github.com/justkawal/excel.git
      ref: 751dfc597c893a0b34eccfe6921f126e03a5c683
  shamsi_date: ^1.1.1
  persian_datetime_picker: ^3.2.0
  crypto: ^3.0.7
  hijri: ^3.0.1
  # Exact pin (no ^): 2.7+ switched to a signed schema-v3 feed that is
  # incompatible with the app-archive.json manifest flow used by this app.
  desktop_updater: 2.0.0-dev.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lang/
    - assets/fonts/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Black.ttf
          weight: 900
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Light.ttf
          weight: 300
    - family: YekanBakh
      fonts:
        - asset: assets/fonts/YekanBakh-Light.ttf
          weight: 300
        - asset: assets/fonts/YekanBakh-Regular.ttf
          weight: 400
        - asset: assets/fonts/YekanBakh-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/YekanBakhFaNum-Black.ttf
          weight: 900
        - asset: assets/fonts/YekanBakhFaNum-Bold.ttf
          weight: 700
        - asset: assets/fonts/YekanBakhFaNum-ExtraBlack.ttf
          weight: 900
        - asset: assets/fonts/YekanBakhFaNum-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/YekanBakhFaNum-Light.ttf
          weight: 300
        - asset: assets/fonts/YekanBakhFaNum-Regular.ttf
          weight: 400
        - asset: assets/fonts/YekanBakhFaNum-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/YekanBakhFaNum-Thin.ttf
          weight: 100
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-VariableFont_opsz,wght.ttf

flutter_launcher_icons:
  windows:
    generate: true
    image_path: "assets/images/hadid_logo.jpg"
